<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../midias/logo.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <title>Paredão da Baixinha | Cadastro</title>
</head>

<body>
  <main class="container">
    <header class="titulo">
      <h1>Bem-vindo ao <br><img src="../midias/logoNome.png" alt="Paredão da Baixinha"></h1>
      <p>Vamos criar sua conta</p>
    </header>

    <form action="#" method="post">
      <label for="nome">Nome:</label>
      <input type="text" name="nome" id="nome" placeholder="Nome de usuário" autocomplete="usernome" required>

      <label for="email">E-mail:</label>
      <input type="email" name="email" id="email" placeholder="exemplo@gmail.com" autocomplete="email" required>

      <label for="senha">Senha:</label>
      <input type="password" name="senha" id="senha" placeholder="Digite sua senha" autocomplete="current-password"
        required>

      <label for="senha">Confirmar senha:</label>
      <input type="password" name="confirmarSenha" id="confirmarSenha" placeholder="Digite sua senha novamente"
        autocomplete="current-password" required>

      <button type="submit">Criar</button>
    </form>

    <section class="cadastro">
      <p>Já tem uma conta? <a href="../index.html">Fazer login</a></p>
    </section>
  </main>
</body>

</html>
