<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/midias/logo.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <title>Paredão da Baixinha | Login</title>
</head>

<body>
    <main class="container">
        <header class="titulo">
            <h1>Bem-vindo ao <br><img src="/midias/logoNome.png" alt="Paredão da Baixinha"></h1>
            <p>Vamos enviar um código para seu E-mail</p>
        </header>

        <form action="#" method="post">
            <label for="email">Informe seu E-mail:</label>
            <input type="email" name="email" id="email" placeholder="exemplo@gmail.com" autocomplete="email" required>

            <button type="submit">Receber código</button>
        </form>

        <section class="cadastro">
            <p>Já tem uma conta? <a href="/index.html">Fazer login</a></p>
        </section>
    </main>
</body>

</html>
