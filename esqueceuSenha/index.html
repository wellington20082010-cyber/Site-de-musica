<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080510">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="../midias/logotipo-KLYVUNE.png" type="image/png">
    <title>Recuperar senha | KLYVUNE</title>
</head>

<body>
    <main class="recuperacao">
        <header class="cabecalho">
            <a href="../index.html" class="logo" aria-label="KLYVUNE, página inicial">KLYVUNE</a>
            <h1>Esqueceu sua senha?</h1>
            <p>Não se preocupe! Informe o e-mail associado à sua conta para iniciar a recuperação.</p>
        </header>

        <form action="#" method="post" id="formRecuperacao">
            <div class="campo">
                <label for="email">E-mail da conta</label>
                <input type="email" name="email" id="email" placeholder="seuemail@exemplo.com" autocomplete="email" required>
            </div>

            <button type="submit" id="recuperar">Recuperar senha</button>
        </form>

        <footer class="rodape">
            <a href="../index.html">Voltar para o login</a>
        </footer>
    </main>
</body>

</html>
