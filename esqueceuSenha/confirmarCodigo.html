<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../midias/logo.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <title>Paredão da Baixinha | Código</title>
</head>

<body>
    <main class="container">
        <header class="titulo">
            <h1>Bem-vindo ao <br><img src="../midias/logoNome.png" alt="Paredão da Baixinha"></h1>
            <p>Um código foi enviado para o e-mail: exemplo@gmail.com</p>
        </header>

        <form action="#" method="post">
            <label for="email">Informe o código:</label>
            <input type="text" name="codigo" id="codigo" placeholder="XXX-XXX" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" autocomplete="one-time-code" required>

            <button type="submit">Confirmar código</button>
        </form>

        <section class="cadastro">
            <p>Já tem uma conta? <a href="../index.html">Fazer login</a></p>
        </section>
    </main>
</body>

</html>
