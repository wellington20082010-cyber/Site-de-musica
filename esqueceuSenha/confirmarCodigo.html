<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080510">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="../midias/logotipo-KLYVUNE.png" type="image/png">
    <title>Verificar código | KLYVUNE</title>
</head>

<body>
    <main class="recuperacao">
        <header class="cabecalho">
            <a href="../index.html" class="logo" aria-label="KLYVUNE, página inicial">KLYVUNE</a>
            <h1>Verifique seu e-mail</h1>
            <p>Enviamos um código de verificação para o seu e-mail. Digite o código abaixo para continuar com a
                recuperação da sua senha.</p>
        </header>

        <form action="#" method="post" id="formCodigo">
            <div class="campo">
                <label for="codigo">Código de verificação</label>
                <input type="text" name="codigo" id="codigo" placeholder="Digite os 6 dígitos" inputmode="numeric"
                    autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" required autofocus>
            </div>

            <button type="submit" id="verificar">Verificar código</button>
        </form>

        <div class="reenviar">
            <p>Não recebeu o código?</p>
            <button type="button" id="reenviarCodigo">Reenviar código</button>
        </div>

        <footer class="rodape">
            <a href="index.html">Voltar</a>
        </footer>
    </main>
</body>

</html>
