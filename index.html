<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Paredão da Baixinha</title>
</head>

<body>
    <main class="container">
        <header class="titulo">
            <h1>Bem-vindo ao <br><span>Paredão da Baixinha</span></h1>
            <p>Entre na sua conta</p>
        </header>

        <form action="#" method="post">
            <label for="email">E-mail:</label>
            <input type="email" name="email" id="email" placeholder="exemplo@gmail.com" autocomplete="email" required>

            <label for="senha">Senha:</label>
            <input type="password" name="senha" id="senha" placeholder="Digite sua senha" autocomplete="current-password" required>

            <p><a href="#">Esqueceu sua senha?</a></p>

            <button type="submit">Entrar</button>
        </form>

        <section class="cadastro">
            <p>Não tem uma conta? <a href="#">Cadastre-se</a></p>
        </section>
    </main>
</body>

</html>
