<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080510">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="midias/logotipo-KLYVUNE.png" type="image/">
    <title>Entrar | KLYVUNE</title>
</head>

<body>
    <main class="login">
        <header class="cabecalho">
            <a href="index.html" class="logo" aria-label="KLYVUNE, página inicial">KLYVUNE</a>
            <h1>Bem-vindo de volta</h1>
            <p>Entre na sua conta e continue ouvindo.</p>
        </header>

        <form action="#" method="post" id="formLogin">
            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" name="email" id="email" placeholder="seuemail@exemplo.com" autocomplete="email"
                    required>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" name="senha" id="senha" placeholder="Digite sua senha"
                    autocomplete="current-password" required>
            </div>

            <div class="opcoes">
                <label for="lembrar">
                    <input type="checkbox" name="lembrar" id="lembrar">
                    Lembrar login
                </label>

                <a href="esqueceuSenha/index.html">Esqueci minha senha</a>

                <button type="submit" id="entrar">Entrar</button>
            </div>
        </form>

        <footer class="rodape">
            <p>Ainda não tem uma conta? <a href="cadastro/index.html">Criar conta</a></p>
        </footer>
    </main>
</body>

</html>
